name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-linux:
    name: ubuntu swift test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: swift test
        run: swift test --package-path ios

  simulator:
    name: macos xcodebuild test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          python3 << 'PY'
          import json, os, subprocess
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          data = json.loads(raw)
          preferred = ["iPhone 16", "iPhone 17", "iPhone 16 Pro", "iPhone 15", "iPhone 16e"]
          found = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") is False:
                      continue
                  name = device.get("name", "")
                  if "iPhone" not in name:
                      continue
                  found.append((name, device["udid"], runtime))
          if not found:
              raise SystemExit("no available iPhone simulator")
          def rank(item):
              name, _, runtime = item
              try:
                  pref = preferred.index(name)
              except ValueError:
                  pref = 50
              return (pref, runtime, name)
          found.sort(key=rank)
          name, udid, runtime = found[0]
          print(f"picked {name} {udid} ({runtime})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"name={name}\n")
              handle.write(f"udid={udid}\n")
          PY

      - name: BusNowCore on iOS simulator
        working-directory: ios
        run: |
          xcodebuild -list
          xcodebuild test \
            -scheme BusNowCore \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$GITHUB_WORKSPACE/CoreResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: BusNow UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/BusNowApp/BusNow.xcodeproj \
            -scheme BusNow \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath ios/BusNowApp/DerivedData \
            -resultBundlePath "$GITHUB_WORKSPACE/TestResults.xcresult" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Simulator screenshots
        if: success()
        run: |
          APP="$(find ios/BusNowApp/DerivedData -path '*iphonesimulator*' -name 'BusNow.app' -type d | head -1)"
          echo "app=$APP"
          bash ios/scripts/capture-screenshots.sh "$APP" "$RUNNER_TEMP/ios-screenshots" "${{ steps.sim.outputs.udid }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          if-no-files-found: warn
          path: |
            TestResults.xcresult
            CoreResults.xcresult
            xcodebuild.log

      - name: Upload screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          if-no-files-found: error
          path: ${{ runner.temp }}/ios-screenshots
