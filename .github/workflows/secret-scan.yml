name: 秘密と個人情報

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: 追跡ファイル
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 検査ルールの自己確認
        run: python3 scripts/scan-secrets.py --self-check

      - name: 追跡ファイルを検査
        run: python3 scripts/scan-secrets.py
