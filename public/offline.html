<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#241c16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BusNow!!" />
    <title>BusNow!!</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #241c16;
        color: #241c16;
        font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
      }
      main {
        box-sizing: border-box;
        min-height: 100dvh;
        display: flex;
        padding:
          max(12px, env(safe-area-inset-top))
          max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom))
          max(12px, env(safe-area-inset-left));
      }
      section {
        position: relative;
        flex: 1;
        overflow: hidden;
        border-radius: 28px;
        background: #f6efe2;
        box-shadow: 0 12px 0 #1a140f;
        padding: 28px 28px 32px 46px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      section::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 18px;
        background: #e25b2a;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.4rem);
        font-weight: 900;
        letter-spacing: -0.045em;
        line-height: 1.15;
      }
      p {
        margin: 14px 0 0;
        color: #5c5146;
        font-size: 1.05rem;
        font-weight: 700;
        line-height: 1.5;
      }
      button {
        margin-top: 28px;
        align-self: flex-start;
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        background: #241c16;
        color: #f6efe2;
        font: inherit;
        font-size: 1.05rem;
        font-weight: 700;
        padding: 0 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>いまはネットにつながっていません</h1>
        <p>停留所の看板を出すには、もう一度つないでください。</p>
        <button type="button" onclick="location.reload()">もう一度ひらく</button>
      </section>
    </main>
  </body>
</html>
